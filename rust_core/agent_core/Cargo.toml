[package]
name = "agent_core"
version.workspace = true
edition.workspace = true

[lib]
name = "agent_core"
crate-type = ["staticlib", "cdylib", "lib"]
# staticlib = musl .a for HarmonyOS (required)
# cdylib    = wasm-pack .wasm output (required for wasm builds)
# lib       = rlib for cargo test and rustc

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
# WASM target dependencies
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# Node target dependencies
napi = { version = "2", optional = true }
napi-derive = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]
node = ["napi", "napi-derive"]
