[package]
name = "agent_core"
version.workspace = true
edition.workspace = true

[lib]
name = "agent_core"
crate-type = ["staticlib", "lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"



ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
